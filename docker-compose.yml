version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: stockwise-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: stockwise
    ports:
      - "5432:5432"
    volumes:
      - stockwise-pgdata:/var/lib/postgresql/data

volumes:
  stockwise-pgdata: